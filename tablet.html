<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>WLED Painter</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:      #0a0a0f;
    --surface: #12121a;
    --panel:   #1a1a26;
    --border:  #2a2a3d;
    --accent:  #7b61ff;
    --glow:    #7b61ff66;
    --text:    #e8e8f0;
    --muted:   #6b6b8a;
    --success: #4ecca3;
    --error:   #ff6b6b;
    --warn:    #ffd166;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%; height: 100dvh;
    overflow: hidden;
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  body { display: flex; flex-direction: column; }

  /* ── Header ──────────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.95rem;
    display: flex; align-items: center; gap: 8px;
  }
  .logo-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 10px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 6px var(--accent); }
    50%      { box-shadow: 0 0 16px var(--accent), 0 0 28px var(--glow); }
  }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .status-pill {
    display: flex; align-items: center; gap: 5px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted);
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .status-dot.ok    { background: var(--success); box-shadow: 0 0 7px var(--success); }
  .status-dot.error { background: var(--error);   box-shadow: 0 0 7px var(--error); }
  .status-dot.busy  { background: var(--warn);    box-shadow: 0 0 7px var(--warn); animation: pulse 0.8s infinite; }
  .mode-link {
    font-family: 'JetBrains Mono', monospace; font-size: 0.65rem;
    color: var(--muted); text-decoration: none;
    padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px;
    transition: color 0.15s, border-color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Toolbar: color picker + tools ──────────────────────────── */
  .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .color-btn {
    position: relative; width: 48px; height: 48px;
    border-radius: 8px; border: 2px solid var(--border);
    overflow: hidden; flex-shrink: 0; cursor: pointer;
  }
  .color-btn input[type="color"] {
    position: absolute; opacity: 0; width: 100%; height: 100%;
    cursor: pointer; top: 0; left: 0;
  }
  .color-swatch-inner { width: 100%; height: 100%; }
  .tools { display: flex; gap: 6px; flex: 1; }
  .tool-btn {
    flex: 1; height: 48px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); color: var(--muted);
    font-family: 'Space Grotesk', sans-serif; font-size: 0.72rem; font-weight: 600;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .tool-btn.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
    box-shadow: 0 0 10px var(--glow);
  }
  .tool-icon { font-size: 1.05rem; }
  .tool-label { font-size: 0.58rem; }

  /* ── Swatches row ───────────────────────────────────────────── */
  .swatches-row {
    display: flex; gap: 6px; align-items: center;
    padding: 7px 12px; overflow-x: auto;
    background: var(--panel); border-bottom: 1px solid var(--border);
    flex-shrink: 0; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .swatches-row::-webkit-scrollbar { display: none; }
  .swatch {
    width: 30px; height: 30px; border-radius: 6px; flex-shrink: 0;
    border: 2px solid transparent; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s, border-color 0.1s;
  }
  .swatch:active { transform: scale(0.9); }
  .swatch.active { border-color: #fff; }
  .swatch.eraser { background: var(--panel); border: 2px dashed var(--border); }

  /* ── Grid area ──────────────────────────────────────────────── */
  .grid-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: var(--bg); position: relative;
  }
  #unconfigured-banner {
    display: none; position: absolute;
    background: #ffd16622; border: 1px solid var(--warn);
    border-radius: 8px; padding: 16px 20px;
    font-size: 0.85rem; color: var(--warn); text-align: center;
  }
  .grid-wrap { position: relative; user-select: none; }
  #pixel-grid {
    display: grid; touch-action: none; cursor: crosshair;
    border: 1px solid var(--border);
    box-shadow: 0 0 40px #7b61ff22;
    border-radius: 2px; overflow: hidden;
  }
  .pixel { background: #000; }
  .grid-overlay { position: absolute; top:0; left:0; pointer-events: none; opacity: 0.1; }

  /* ── Bottom action bar ──────────────────────────────────────── */
  .action-bar {
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  .bri-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
  }
  .bri-icon { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; }
  .bri-val {
    font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
    color: var(--accent); min-width: 28px; text-align: right; flex-shrink: 0;
  }
  input[type="range"] {
    flex: 1; -webkit-appearance: none;
    height: 4px; background: var(--border); border-radius: 2px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
    box-shadow: 0 0 8px var(--glow);
  }
  .mp-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .mp-row input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
  .mp-row label {
    font-size: 0.8rem; color: var(--text); cursor: pointer; margin: 0; flex-shrink: 0;
  }
  .mp-users {
    font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); margin-left: auto;
  }
  .btn-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
  }
  .btn-send {
    grid-column: 1 / -1;
    height: 50px; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; cursor: pointer;
    font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; font-weight: 700;
    transition: background 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .btn-send:active { background: #9580ff; }
  .btn-secondary {
    height: 44px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    font-family: 'Space Grotesk', sans-serif; font-size: 0.82rem; font-weight: 600;
    transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .btn-secondary:active { border-color: var(--accent); }
  .btn-danger {
    height: 44px; background: transparent; color: var(--error);
    border: 1px solid var(--error); border-radius: 8px; cursor: pointer;
    font-family: 'Space Grotesk', sans-serif; font-size: 0.82rem; font-weight: 600;
    transition: background 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .btn-danger:active { background: #ff6b6b22; }

  /* ── Toast ──────────────────────────────────────────────────── */
  #toast {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%) translateY(30px);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 18px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.73rem; color: var(--text);
    opacity: 0; transition: all 0.3s cubic-bezier(.34,1.56,.64,1);
    z-index: 999; white-space: nowrap; pointer-events: none;
  }
  #toast.show  { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.ok    { border-color: var(--success); color: var(--success); }
  #toast.error { border-color: var(--error);   color: var(--error); }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>WLED Painter</div>
  <div class="header-right">
    <div class="status-pill">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">loading…</span>
    </div>
    <a href="/desktop" class="mode-link">Desktop ↗</a>
  </div>
</header>

<div class="toolbar">
  <div class="color-btn">
    <div class="color-swatch-inner" id="color-swatch" style="background:#ff4444"></div>
    <input type="color" id="color-picker" value="#ff4444" oninput="onColorPick(this.value)" />
  </div>
  <div class="tools">
    <div class="tool-btn active" id="tool-paint" onclick="setTool('paint')">
      <span class="tool-icon">✏️</span><span class="tool-label">Paint</span>
    </div>
    <div class="tool-btn" id="tool-erase" onclick="setTool('erase')">
      <span class="tool-icon">🗑</span><span class="tool-label">Erase</span>
    </div>
    <div class="tool-btn" id="tool-fill" onclick="setTool('fill')">
      <span class="tool-icon">🪣</span><span class="tool-label">Fill</span>
    </div>
  </div>
</div>

<div class="swatches-row" id="swatches"></div>

<div class="grid-area" id="grid-area">
  <div id="unconfigured-banner">
    ⚠ WLED not configured — <a href="/admin" style="color:var(--warn)">go to Admin</a>
  </div>
  <div class="grid-wrap">
    <div id="pixel-grid"></div>
    <canvas id="grid-overlay" class="grid-overlay"></canvas>
  </div>
</div>

<div class="action-bar">
  <div class="bri-row">
    <span class="bri-icon">☀</span>
    <input type="range" id="brightness" min="0" max="255" value="128"
      oninput="document.getElementById('bri-label').textContent=this.value" />
    <span class="bri-val" id="bri-label">128</span>
  </div>
  <div class="mp-row">
    <input type="checkbox" id="multiplayer" checked onchange="onMultiplayerToggle(this.checked)" />
    <label for="multiplayer">Multiplayer</label>
    <span class="mp-users" id="user-count"></span>
  </div>
  <div class="btn-grid">
    <button class="btn-send" onclick="sendAll()">Send All</button>
    <button class="btn-secondary" onclick="clearCanvas()">Clear Canvas</button>
    <button class="btn-danger"    onclick="clearWled()">Clear WLED</button>
  </div>
</div>

<div id="toast"></div>

<script>
const PALETTE = [
  "#ff0000","#ff4400","#ff8800","#ffcc00","#ffff00","#aaff00",
  "#00ff00","#00ffaa","#00ffff","#00aaff","#0066ff","#0000ff",
  "#6600ff","#aa00ff","#ff00ff","#ff0088","#ff0044",
  "#ffffff","#cccccc","#888888","#444444","#111111","#000000",
  "#ff6644","#ffaa66","#ffdd99","#99dd66","#66ddcc","#99ccff",
];

let cols = 16, rows = 1, cellSize = 20, serpentine = false;
let tool = "paint", color = "#ff4444";
let pixels = [], painting = false, sendDebounce = null;

// ── Multiplayer state ─────────────────────────────────────────────────────────
let multiplayer = true;
let dirtyPixels = new Set();
let evtSource   = null;
let userCount   = 0;

// ── Boot ──────────────────────────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded", async () => {
  buildSwatches();
  await loadConfig();
  requestAnimationFrame(() => {
    buildGrid();
    if (multiplayer) connectMultiplayer();
  });
});

async function loadConfig() {
  try {
    const res  = await fetch("/api/config");
    const data = await res.json();
    if (!data.ok) return;
    const c = data.config;
    cols       = c.cols       ?? 16;
    rows       = c.rows       ?? 1;
    serpentine = c.serpentine ?? false;

    const bri = c.brightness ?? 128;
    document.getElementById("brightness").value      = bri;
    document.getElementById("bri-label").textContent = bri;

    const configured = !!c.deviceName || c.ledCount > 0;
    if (!configured) {
      document.getElementById("unconfigured-banner").style.display = "block";
      setStatus("error", "not configured");
    } else {
      setStatus("ok", c.deviceName || "connected");
    }
  } catch {
    setStatus("error", "offline");
  }
}

// ── Grid ──────────────────────────────────────────────────────────────────────
function buildGrid() {
  const area  = document.getElementById("grid-area");
  const areaW = area.clientWidth  - 8;
  const areaH = area.clientHeight - 8;
  cellSize = Math.max(8, Math.min(48, Math.floor(Math.min(areaW / cols, areaH / rows))));

  const total = cols * rows;
  pixels = Array.from({ length: total }, () => ({ r: 0, g: 0, b: 0 }));

  const grid = document.getElementById("pixel-grid");
  grid.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
  grid.style.gridTemplateRows    = `repeat(${rows}, ${cellSize}px)`;
  grid.innerHTML = "";

  for (let idx = 0; idx < total; idx++) {
    const cell = document.createElement("div");
    cell.className    = "pixel";
    cell.dataset.idx  = idx;
    cell.style.width  = cellSize + "px";
    cell.style.height = cellSize + "px";
    cell.style.background = "#000";
    grid.appendChild(cell);
  }

  grid.addEventListener("mousedown", e => {
    if (e.target.dataset.idx === undefined) return;
    e.preventDefault(); painting = true;
    applyTool(parseInt(e.target.dataset.idx));
  });
  grid.addEventListener("mousemove", e => {
    if (!painting || e.target.dataset.idx === undefined) return;
    applyTool(parseInt(e.target.dataset.idx));
  });
  document.addEventListener("mouseup", () => { painting = false; });

  grid.addEventListener("touchstart", onTouchPaint, { passive: false });
  grid.addEventListener("touchmove",  onTouchPaint, { passive: false });
  grid.addEventListener("touchend",   () => { painting = false; }, { passive: true });

  drawGridLines();
}

function onTouchPaint(e) {
  e.preventDefault();
  painting = true;
  const touch = e.touches[0];
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  if (el && el.dataset.idx !== undefined) applyTool(parseInt(el.dataset.idx));
}

function ledIndex(gridIdx) {
  const row = Math.floor(gridIdx / cols);
  const col = gridIdx % cols;
  if (serpentine && row % 2 === 1) return row * cols + (cols - 1 - col);
  return gridIdx;
}

function ledToGridIndex(ledIdx) {
  const row = Math.floor(ledIdx / cols);
  const col = ledIdx % cols;
  if (serpentine && row % 2 === 1) return row * cols + (cols - 1 - col);
  return ledIdx;
}

function drawGridLines() {
  const canvas = document.getElementById("grid-overlay");
  const w = cols * cellSize, h = rows * cellSize;
  canvas.width  = w; canvas.height = h;
  canvas.style.width = w + "px"; canvas.style.height = h + "px";
  if (cellSize < 10) { canvas.style.display = "none"; return; }
  canvas.style.display = "block";
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 0.5;
  for (let x = 0; x <= cols; x++) { ctx.beginPath(); ctx.moveTo(x*cellSize,0); ctx.lineTo(x*cellSize,h); ctx.stroke(); }
  for (let y = 0; y <= rows; y++) { ctx.beginPath(); ctx.moveTo(0,y*cellSize); ctx.lineTo(w,y*cellSize); ctx.stroke(); }
}

// Preserve pixel state across orientation-change rebuilds.
window.addEventListener("resize", () => {
  const save = pixels.map(p => ({...p}));
  requestAnimationFrame(() => {
    buildGrid();
    save.forEach((p, i) => {
      if (i < pixels.length) {
        pixels[i] = p;
        const cell = document.querySelector(`[data-idx="${i}"]`);
        if (cell) cell.style.background = `rgb(${p.r},${p.g},${p.b})`;
      }
    });
  });
});

// ── Tools ─────────────────────────────────────────────────────────────────────
function applyTool(gridIdx) {
  if (tool === "paint") paintPixel(gridIdx, hexToRgb(color));
  else if (tool === "erase") paintPixel(gridIdx, { r:0, g:0, b:0 });
  else if (tool === "fill") {
    const target = { ...pixels[gridIdx] }, fill = hexToRgb(color);
    if (rgbEq(target, fill)) return;
    floodFill(gridIdx, target, fill);
  }
  scheduleSend();
}

function paintPixel(gridIdx, rgb) {
  pixels[gridIdx] = { ...rgb };
  dirtyPixels.add(gridIdx);
  const cell = document.querySelector(`[data-idx="${gridIdx}"]`);
  if (cell) cell.style.background = `rgb(${rgb.r},${rgb.g},${rgb.b})`;
}

function floodFill(startIdx, target, fill) {
  const stack = [startIdx], visited = new Set();
  while (stack.length) {
    const idx = stack.pop();
    if (idx < 0 || idx >= pixels.length || visited.has(idx) || !rgbEq(pixels[idx], target)) continue;
    visited.add(idx); paintPixel(idx, fill);
    const row = Math.floor(idx/cols), col = idx%cols;
    if (col > 0)      stack.push(idx-1);
    if (col < cols-1) stack.push(idx+1);
    if (row > 0)      stack.push(idx-cols);
    if (row < rows-1) stack.push(idx+cols);
  }
}

// ── Send ─────────────────────────────────────────────────────────────────────
function scheduleSend() {
  clearTimeout(sendDebounce);
  sendDebounce = setTimeout(sendChanges, 60);
}

async function sendChanges() {
  const brightness = parseInt(document.getElementById("brightness").value);
  let body;

  if (multiplayer) {
    if (dirtyPixels.size === 0) return;
    const delta = [];
    for (const gridIdx of dirtyPixels) {
      delta.push([ledIndex(gridIdx), pixels[gridIdx].r, pixels[gridIdx].g, pixels[gridIdx].b]);
    }
    dirtyPixels.clear();
    body = { delta, brightness };
  } else {
    const ledPixels = Array(pixels.length);
    for (let i = 0; i < pixels.length; i++) {
      const p = pixels[i];
      ledPixels[ledIndex(i)] = [p.r, p.g, p.b];
    }
    body = { pixels: ledPixels, brightness };
  }
  await postSend(body);
}

async function sendAll() {
  const brightness = parseInt(document.getElementById("brightness").value);
  const ledPixels  = Array(pixels.length);
  for (let i = 0; i < pixels.length; i++) {
    const p = pixels[i];
    ledPixels[ledIndex(i)] = [p.r, p.g, p.b];
  }
  dirtyPixels.clear();
  await postSend({ pixels: ledPixels, brightness });
}

async function postSend(body) {
  setStatus("busy", "sending…");
  try {
    const res  = await fetch("/api/send", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.ok) setStatus("ok", body.delta ? `+${body.delta.length} px` : `sent ${pixels.length} LEDs`);
    else { setStatus("error", "send failed"); toast(data.error, "error"); }
  } catch (e) {
    setStatus("error", "offline"); toast(e.message, "error");
  }
}

async function clearWled() {
  setStatus("busy", "clearing…");
  try {
    const res  = await fetch("/api/clear", { method:"POST", headers:{"Content-Type":"application/json"}, body:"{}" });
    const data = await res.json();
    if (data.ok) { clearCanvas(); setStatus("ok", "cleared"); toast("Cleared ✓", "ok"); }
    else { setStatus("error", "clear failed"); toast(data.error, "error"); }
  } catch (e) { setStatus("error", "offline"); toast(e.message, "error"); }
}

function clearCanvas() {
  pixels = pixels.map(() => ({ r:0, g:0, b:0 }));
  dirtyPixels.clear();
  document.querySelectorAll(".pixel").forEach(c => c.style.background = "#000");
}

// ── Multiplayer ───────────────────────────────────────────────────────────────
function onMultiplayerToggle(enabled) {
  multiplayer = enabled;
  dirtyPixels.clear();
  if (enabled) connectMultiplayer();
  else disconnectMultiplayer();
}

function connectMultiplayer() {
  if (evtSource) { evtSource.close(); evtSource = null; }
  evtSource = new EventSource("/api/events");
  evtSource.addEventListener("canvas", e => applyFullCanvas(JSON.parse(e.data)));
  evtSource.addEventListener("delta",  e => applyDelta(JSON.parse(e.data)));
  evtSource.addEventListener("users",  e => { userCount = parseInt(e.data); updateUserCount(); });
  evtSource.onerror = () => { /* degrade silently */ };
}

function disconnectMultiplayer() {
  if (evtSource) { evtSource.close(); evtSource = null; }
  userCount = 0;
  updateUserCount();
}

function applyFullCanvas(canvas) {
  canvas.forEach(([r, g, b], ledIdx) => {
    const gridIdx = ledToGridIndex(ledIdx);
    if (gridIdx >= 0 && gridIdx < pixels.length) {
      pixels[gridIdx] = {r, g, b};
      const cell = document.querySelector(`[data-idx="${gridIdx}"]`);
      if (cell) cell.style.background = `rgb(${r},${g},${b})`;
    }
  });
}

function applyDelta(changes) {
  changes.forEach(([ledIdx, r, g, b]) => {
    const gridIdx = ledToGridIndex(ledIdx);
    if (gridIdx >= 0 && gridIdx < pixels.length) {
      pixels[gridIdx] = {r, g, b};
      const cell = document.querySelector(`[data-idx="${gridIdx}"]`);
      if (cell) cell.style.background = `rgb(${r},${g},${b})`;
    }
  });
}

function updateUserCount() {
  const el = document.getElementById("user-count");
  if (!el) return;
  el.textContent = (multiplayer && userCount > 0) ? `${userCount} online` : "";
}

// ── UI ────────────────────────────────────────────────────────────────────────
function setTool(t) {
  tool = t;
  ["paint","erase","fill"].forEach(id =>
    document.getElementById("tool-"+id).classList.toggle("active", id===t)
  );
}

function buildSwatches() {
  const cont = document.getElementById("swatches");
  const eraser = document.createElement("div");
  eraser.className = "swatch eraser"; eraser.title = "Eraser";
  eraser.onclick = () => setTool("erase");
  cont.appendChild(eraser);

  PALETTE.forEach(hex => {
    const s = document.createElement("div");
    s.className = "swatch"; s.style.background = hex; s.title = hex;
    s.onclick = () => {
      color = hex;
      document.getElementById("color-picker").value = hex;
      document.getElementById("color-swatch").style.background = hex;
      setTool("paint");
      document.querySelectorAll(".swatch").forEach(el => el.classList.remove("active"));
      s.classList.add("active");
    };
    cont.appendChild(s);
  });
}

function onColorPick(hex) {
  color = hex;
  document.getElementById("color-swatch").style.background = hex;
  document.querySelectorAll(".swatch").forEach(el => el.classList.remove("active"));
  setTool("paint");
}

function setStatus(type, text) {
  document.getElementById("status-dot").className   = "status-dot " + type;
  document.getElementById("status-text").textContent = text;
}

let toastTimer;
function toast(msg, type = "ok") {
  const el = document.getElementById("toast");
  el.textContent = msg; el.className = "show " + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ""; }, 3000);
}

function hexToRgb(hex) {
  return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
}
function rgbEq(a, b) { return a.r===b.r && a.g===b.g && a.b===b.b; }
